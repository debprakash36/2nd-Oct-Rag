[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Retrieval-augmented generation chatbot over a private document corpus"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "python-multipart",
    "pypdf",
    "python-docx",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]
# ChromaDB vector backend. Optional because `vector_store=chroma` is the only
# thing that needs it: pgvector deployments import it nowhere (the import in
# app/retrieval/vector_store.py is lazy), and making it mandatory would add a
# heavy native dependency tree to installs that will never use it.
chroma = ["chromadb>=1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Load tests are deselected by default: they need a seeded corpus, start a real
# server, and take tens of seconds, so `make check` should not pay for them. Run
# them with `make load-test`, or `pytest -m load tests/load/`.
#
# `indexcheck` is deselected for a different reason: it reads the checked-in
# `rag.db` and `data/chroma`, so its result depends on working-tree state rather
# than on the code. Run it with `pytest -m indexcheck` when you want to know
# whether the derived index agrees with the authoritative chunks.
addopts = "-q -m 'not load and not indexcheck'"
markers = [
    "load: starts a real server against a seeded corpus; deselected by default",
    "indexcheck: compares checked-in rag.db against data/chroma; deselected by default",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends/File defaults are the framework's idiom, not a bug.
"app/api/*.py" = ["B008"]

[tool.mypy]
# 3.12, not 3.11, and not arbitrarily: chromadb pulls in numpy, whose bundled
# stubs use `type` statements. mypy parses every stub in site-packages it can
# reach regardless of `follow_imports`, so targeting 3.11 fails on a file we
# neither wrote nor control. `follow_imports = "skip"` for numpy/chromadb does
# not help, because skip suppresses analysis but not the initial parse.
#
# The cost is that mypy will now accept 3.12-only syntax in `app/` even though
# `requires-python` still says 3.11 -- such code would pass typecheck and then
# fail at runtime on 3.11. If 3.11 support is real, raise `requires-python` to
# >=3.12 to match; that is a project decision, not one to make silently here.
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]
