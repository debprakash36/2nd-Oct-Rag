# Alembic configuration.
#
# The URL is intentionally left blank here. app/db/session.py and alembic/env.py
# both read DATABASE_URL through Settings so there is exactly one place that
# decides which database is being talked to; hard-coding a second DSN in this
# file is how migrations and the app end up pointed at different databases.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# Timestamped revision filenames sort chronologically in `ls`.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S